<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="auth-wrap"><section class="auth-card"><b class="brand">Shopp Digital</b><h1>Daftar</h1><p class="muted">Cukup username dan password.</p><form id="f"><label>Username</label><input id="username" autocomplete="username" autocapitalize="none" placeholder="3-20 karakter: huruf, angka, _ atau ." required><label>Password</label><input id="password" type="password" minlength="6" autocomplete="new-password" required><label>Konfirmasi Password</label><input id="password2" type="password" minlength="6" autocomplete="new-password" required><button class="btn primary">Buat Akun</button></form><p id="msg" class="msg"></p><p class="muted center"><a href="login.html">Kembali login</a></p></section></main><script src="assets/js/config.js"></script><script src="assets/js/supabase.js"></script><script src="assets/js/auth.js"></script><script>f.onsubmit=async e=>{e.preventDefault();const u=normalizeUsername(username.value);if(!validUsername(u)){msg.textContent="Username 3-20 karakter: huruf kecil, angka, _ atau .";return}if(password.value!==password2.value){msg.textContent="Password tidak sama";return}msg.textContent="Mendaftarkan...";const{data,error}=await sb.auth.signUp({email:usernameToEmail(u),password:password.value,options:{data:{username:u}}});if(error){msg.textContent=/already|registered/i.test(error.message)?"Username sudah dipakai.":error.message;return}if(!data.session){msg.textContent="Akun dibuat, tetapi 'Confirm email' masih aktif di Supabase. Matikan dulu di Auth > Providers > Email.";return}location.replace("dashboard.html")}</script></body></html>
