<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="auth-wrap"><section class="auth-card"><b class="brand">Shopp Digital</b><h1>Masuk</h1><p class="muted">Username + password.</p><form id="f"><label>Username</label><input id="username" autocomplete="username" autocapitalize="none" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="btn primary">Masuk</button></form><p id="msg" class="msg"></p><p class="muted center">Belum punya akun? <a href="register.html">Daftar</a></p></section></main><script src="assets/js/config.js"></script><script src="assets/js/supabase.js"></script><script src="assets/js/auth.js"></script><script>f.onsubmit=async e=>{e.preventDefault();msg.textContent="Memproses...";const{error}=await sb.auth.signInWithPassword({email:usernameToEmail(username.value),password:password.value});if(error)msg.textContent=error.message==="Invalid login credentials"?"Username atau password salah.":error.message;else location.replace("dashboard.html")}</script></body></html>
